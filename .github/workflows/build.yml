name: Build Filez

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Filez.xcodeproj -scheme Filez

      - name: Build (unsigned)
        run: |
          xcodebuild -project Filez.xcodeproj -scheme Filez \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/Filez.app Payload/
          zip -qry Filez.ipa Payload

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Filez.ipa --target "$GITHUB_SHA" --title "Filez (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Requires iOS 18 or later. Install with LiveContainer."

      - uses: actions/upload-artifact@v4
        with:
          name: Filez-ipa
          path: Filez.ipa
